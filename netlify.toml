[build]
  # Só o build do frontend: o esbuild de server/index.ts gera o backend Express,
  # que o Netlify não serve neste site estático.
  command = "npx vite build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION = "20"

# O app usa hash routing (useHashLocation), mas isto garante que qualquer
# path acessado direto caia no index.html em vez de 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
